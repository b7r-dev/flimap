version: 2

project_name: flimap

before:
  hooks:
    - go mod tidy

builds:
  - id: flimap
    main: .
    binary: flimap
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    targets:
      - darwin_arm64
      - darwin_amd64
      - linux_amd64
      - linux_arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
